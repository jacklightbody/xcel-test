<!DOCTYPE html>
<html>
<head>
    <title>Simple Cell Resolver Test</title>
</head>
<body>
    <h1>Cell Resolver Test</h1>
    <div id="test-results"></div>
    
    <script src="scripts/cell-resolver.js"></script>
    <script>
        // Test if CellResolver loaded
        window.onload = function() {
            const results = document.getElementById('test-results');
            
            if (typeof window.CellResolver === 'undefined') {
                results.innerHTML = '<p style="color: red;">ERROR: CellResolver not loaded</p>';
                return;
            }
            
            if (typeof window.CellResolver.createLocationString === 'undefined') {
                results.innerHTML = '<p style="color: red;">ERROR: createLocationString not available</p>';
                return;
            }
            
            // Test basic functionality
            try {
                const test1 = window.CellResolver.createLocationString("Sheet1!A1");
                const test2 = window.CellResolver.createLocationString({
                    cell: "Sheet1!B2",
                    value: 100
                });
                const test3 = window.CellResolver.createLocationString({
                    relativeTo: {
                        sheet: "Sheet1",
                        referenceCell: "Total",
                        colOffset: 1,
                        rowOffset: 0
                    },
                    value: 200
                });
                
                results.innerHTML = `
                    <p style="color: green;">✓ CellResolver loaded successfully</p>
                    <p>Test 1 (string): ${test1}</p>
                    <p>Test 2 (cell): ${test2}</p>
                    <p>Test 3 (relativeTo): ${test3}</p>
                `;
            } catch (error) {
                results.innerHTML = `<p style="color: red;">ERROR: ${error.message}</p>`;
            }
        };
    </script>
</body>
</html>
